# Configuração inicial da Cloudflare — rodar UMA VEZ, à mão
# (GitHub → Actions → "Configurar Cloudflare" → Run workflow).
#
# Pré-requisitos (segredos do repositório, em Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   token da conta Cloudflare (ver docs/IMPLANTACAO.md)
#   CLOUDFLARE_ACCOUNT_ID  ID da conta Cloudflare
#   ADMIN_EMAILS           e-mails que podem entrar no painel, separados por vírgula
#
# O que faz (e pode ser repetido sem estragar nada — reaproveita o que já existe):
#   1. cria o banco D1 "eloa" e o KV "perfumaria-eloa-fotos", só se ainda não existirem;
#   2. grava os IDs no wrangler.jsonc e faz commit no main;
#   3. aplica as migrations (estrutura + catálogo atual de 67 produtos) — só na 1ª vez;
#   4. publica o Worker e cria o segredo AUTH_PEPPER (aleatório, ninguém vê).
# Nada aqui cria plano pago: D1, KV e Workers ficam no plano gratuito.
name: Configurar Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  configurar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
    steps:
      - name: Conferir segredos
        run: |
          falta=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && falta="$falta CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && falta="$falta CLOUDFLARE_ACCOUNT_ID"
          [ -z "$ADMIN_EMAILS" ] && falta="$falta ADMIN_EMAILS"
          if [ -n "$falta" ]; then echo "::error::Faltam os segredos:$falta"; exit 1; fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Banco D1 e KV (cria só se não existir)
        run: node scripts/configurar-cloudflare.mjs

      - name: Gravar IDs no repositório
        run: |
          if git diff --quiet wrangler.jsonc; then
            echo "wrangler.jsonc já estava configurado."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wrangler.jsonc
            git commit -m "chore(cloudflare): IDs do banco D1 e do KV de fotos"
            git push
          fi

      - name: Estrutura do banco e catálogo inicial
        run: npx wrangler d1 migrations apply eloa --remote

      - name: Publicar o Worker
        run: npx wrangler deploy

      - name: Segredos do Worker
        run: |
          if npx wrangler secret list 2>/dev/null | grep -q '"AUTH_PEPPER"'; then
            echo "AUTH_PEPPER já existe — mantido (trocar invalidaria todas as senhas)."
          else
            openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put AUTH_PEPPER
          fi
          printf '%s' "$ADMIN_EMAILS" | npx wrangler secret put ADMIN_EMAILS
          echo "Pronto. Endereço provisório: veja 'workers.dev' no resumo do deploy acima."
